version: 3
tasks:
  lint:
    desc: Run basic linting with prettier, phpstan & phpcs
    deps:
      - install-dependencies
    cmds:
      - task: lint:node
      - composer lint

  lint:node:
    dir: util
    internal: true
    cmd: npm run lint

  prettier:
    desc: Make prettier process and fix all files in src/ and tests/
    dir: util
    deps:
      - install-dependencies
    cmd: npx prettier -w --config ../.prettierrc ../src/ ../tests/

  release:
    desc: Create a tagged release to publish a new version of the package
    deps:
      - lint
    dir: util
    cmd: npm run release

  install-dependencies:
    internal: true
    deps:
      - install-dependencies:node
      - install-dependencies:php

  install-dependencies:node:
    internal: true
    dir: util
    run: when_changed
    sources:
      - package.json
      - package-lock.json
    generates:
      - package-lock.json
      - node_modules/**/*
    cmd: npm i

  install-dependencies:php:
    internal: true
    run: when_changed
    sources:
      - composer.json
      - composer.lock
    generates:
      - vendor/**/*
    cmd: composer install
